name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK уже предустановлен на ubuntu-latest (ANDROID_HOME),
      # лицензии приняты — отдельный setup-android не нужен и вызывает
      # ошибку "Failed to find package 'tools'".

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon || (gradle wrapper --gradle-version 8.2 && ./gradlew assembleDebug --no-daemon)

      - name: Run unit tests
        run: (./gradlew testDebugUnitTest --no-daemon) || (gradle testDebugUnitTest --no-daemon)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
